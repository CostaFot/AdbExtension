name: Record Download Stats

on:
  schedule:
    - cron: '17 3 * * *'   # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect stats
        shell: pwsh
        env:
          GH_TOKEN:            ${{ github.token }}
          STORE_TENANT_ID:     ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID:     ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")

          # --- GitHub + WinGet: cumulative downloads across all release assets ---
          $ghLines = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate `
            --jq '[.[].assets[].download_count] | add // 0'
          $github = ($ghLines | ForEach-Object { [int]$_ } | Measure-Object -Sum).Sum

          # --- Microsoft Store: cumulative acquisitions since launch ---
          # Skipped (left blank) if the STORE_* secrets aren't configured.
          $store = ""
          if (-not [string]::IsNullOrWhiteSpace($env:STORE_TENANT_ID)) {
            try {
              $store = ./Get-StoreStats.ps1 -StartDate ([datetime]"2026-04-01")
            } catch {
              Write-Host "::warning::Store fetch failed: $_"
            }
          }

          # --- Append one row per day (idempotent on re-runs) ---
          $file = "download-stats.csv"
          if (-not (Test-Path $file)) {
            "date,github_downloads,store_acquisitions" | Set-Content $file -Encoding utf8
          }
          (Get-Content $file) | Where-Object { $_ -notmatch "^$date," } | Set-Content $file -Encoding utf8
          "$date,$github,$store" | Add-Content $file -Encoding utf8

          Write-Host "Recorded $date -> github=$github store=$store"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download-stats.csv
          if git diff --staged --quiet; then
            echo "No change to commit"
          else
            git commit -m "chore: record download stats [skip ci]"
            git push
          fi
