name: Record Download Stats

on:
  schedule:
    - cron: '17 3 * * *'   # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record total downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TOTAL=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '[.[].assets[].download_count] | add // 0' \
            | awk '{s+=$1} END {print s+0}')

          FILE=download-stats.csv
          [ -f "$FILE" ] || echo "date,total_downloads" > "$FILE"

          # Idempotent: drop any existing row for today, then append the latest count
          grep -v "^$DATE," "$FILE" > "$FILE.tmp" || true
          mv "$FILE.tmp" "$FILE"
          echo "$DATE,$TOTAL" >> "$FILE"

          echo "Recorded $TOTAL downloads for $DATE"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download-stats.csv
          if git diff --staged --quiet; then
            echo "No change to commit"
          else
            git commit -m "chore: record download stats [skip ci]"
            git push
          fi
